<!DOCTYPE html>
<html>
<head>
    <title>웹 STT 예제</title>
</head>
<body>
    <div>
        <button id="startBtn">음성인식 시작</button>
        <button id="stopBtn">중지</button>
        <div id="result"></div>
    </div>

    <script>
        // 브라우저 지원 확인
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            // 설정
            recognition.continuous = true;          // 연속 인식
            recognition.interimResults = true;      // 중간 결과 표시
            recognition.lang = 'ko-KR';            // 한국어

            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const resultDiv = document.getElementById('result');

            // 음성인식 시작
            startBtn.addEventListener('click', () => {
                recognition.start();
                startBtn.disabled = true;
                stopBtn.disabled = false;
            });

            // 음성인식 중지
            stopBtn.addEventListener('click', () => {
                recognition.stop();
                startBtn.disabled = false;
                stopBtn.disabled = true;
            });

            // 결과 처리
            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                resultDiv.innerHTML = transcript;

                // 최종 결과일 때 SpringBoot로 전송
                if (event.results[event.resultIndex].isFinal) {
                    sendToSpringBoot(transcript);
                }
            };

            // 에러 처리
            recognition.onerror = (event) => {
                console.error('음성인식 오류:', event.error);
            };

        } else {
            alert('이 브라우저는 음성인식을 지원하지 않습니다.');
        }

        // SpringBoot로 전송
        function sendToSpringBoot(text) {
            fetch('http://localhost:8080/api/voice', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    voiceText: text,
                    timestamp: new Date().toISOString()
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('서버 응답:', data);
            })
            .catch(error => {
                console.error('전송 오류:', error);
            });
        }
    </script>
</body>
</html>
