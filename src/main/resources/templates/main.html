<!DOCTYPE html>
<html>
<head>
    <title>웹 STT 예제</title>
</head>
<body>
    <div>
        <button id="startBtn">음성인식 시작</button>
        <button id="stopBtn">중지</button>
        <div id="result"></div>
    </div>

    <script>
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            // recognition 설정
            recognition.continuous = true;          // 연속 인식
            recognition.interimResults = true;      // 중간 결과 표시
            recognition.lang = 'ko-KR','en-US';     // 한국어, 영어

            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const resultDiv = document.getElementById('result');

            startBtn.addEventListener('click', () => {
                recognition.start();
                startBtn.disabled = true;
                stopBtn.disabled = false;
            });

            stopBtn.addEventListener('click', () => {
                recognition.stop();
                startBtn.disabled = false;
                stopBtn.disabled = true;
            });

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                resultDiv.innerHTML = transcript;

                if (event.results[event.resultIndex].isFinal) {
                    sendToServer(transcript);
                }
            };
            recognition.onerror = (event) => {
                console.error('음성인식 오류:', event.error);
            };

        } else {
            alert('이 브라우저는 음성인식을 지원하지 않습니다.');
        }

        function sendToServer(text) {
            fetch('http://localhost:8080/api/voice', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    voiceText: text,
                    timestamp: new Date().toISOString()
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('서버 응답:', data);
            })
            .catch(error => {
                console.error('전송 오류:', error);
            });
        }
    </script>
</body>
</html>
